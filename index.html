<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Espião - por Daniel Ruas</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; /* dark blue */
            color: #f8fafc;
            user-select: none; /* Evita seleção de texto acidental no mobile */
            -webkit-tap-highlight-color: transparent;
        }

        /* Animação suave para troca de telas */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo do scrollbar para a lista de locais */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Container Principal (Modo Mobile First) -->
    <main id="app" class="flex-1 max-w-md w-full mx-auto p-6 flex flex-col justify-center fade-in">
        <!-- O conteúdo será injetado aqui via JavaScript -->
    </main>

    <script>
        // --- BASE DE DADOS DO JOGO ---
        const LOCATIONS = {
            "Avião": ["Piloto", "Comissário de Bordo", "Mecânico", "Passageiro de Primeira Classe", "Marechal do Ar", "Co-piloto", "Passageiro Assustado", "Criança Chorona"],
            "Banco": ["Gerente", "Caixa", "Segurança", "Cliente Vip", "Assaltante de Banco", "Consultor Financeiro", "Faxineiro", "Motorista do Carro Forte"],
            "Hospital": ["Cirurgião", "Enfermeiro", "Paciente", "Recepcionista", "Anestesista", "Diretor do Hospital", "Visitante", "Paramédico"],
            "Restaurante": ["Chef de Cozinha", "Garçom", "Cliente Crítico", "Hostess", "Sommelier", "Lavador de Pratos", "Cliente em Encontro", "Inspetor de Saúde"],
            "Escola": ["Diretor", "Professor", "Aluno Bagunceiro", "Aluno Nerd", "Zelador", "Inspetor de Pátio", "Merendeira", "Professor de Ed. Física"],
            "Submarino": ["Capitão", "Operador de Sonar", "Cozinheiro", "Marinheiro", "Mergulhador", "Engenheiro Chefe", "Imediato", "Prisioneiro"],
            "Estação Espacial": ["Astronauta", "Cientista", "Engenheiro de Sistemas", "Médico", "Turista Espacial", "Comandante", "Piloto do Módulo", "Especialista em Robótica"],
            "Cinema": ["Espectador", "Projecionista", "Vendedor de Pipoca", "Gerente", "Segurança", "Crítico de Cinema", "Pessoa Falando no Celular", "Criança Animada"],
            "Praia": ["Salva-vidas", "Surfista", "Vendedor de Picolé", "Turista Queimado", "Criança na Areia", "Biólogo Marinho", "Mergulhador", "Fotógrafo"],
            "Zoológico": ["Tratador de Animais", "Veterinário", "Visitante", "Guia Turístico", "Criança Perdida", "Pesquisador", "Segurança", "Fotógrafo de Natureza"]
        };

        // --- ESTADO DO JOGO ---
        let state = {
            players: [],      // Nomes dos jogadores
            gameData: [],     // Array de objetos com { nome, papel, espião }
            currentLocation: "",
            spyPlayer: "",
            currentPlayerIndex: 0,
            screen: 'setup',  // 'setup', 'pass', 'reveal', 'play', 'end'
            timeRemaining: 8 * 60, // 8 minutos
            timerInterval: null
        };

        // Elemento raiz
        const appElement = document.getElementById('app');

        // --- FUNÇÕES DE RENDERIZAÇÃO DE TELAS ---

        function render() {
            appElement.innerHTML = ''; // Limpa tela
            appElement.className = "flex-1 max-w-md w-full mx-auto p-6 flex flex-col fade-in"; // Reseta animação

            switch (state.screen) {
                case 'setup':
                    renderSetupScreen();
                    break;
                case 'pass':
                    renderPassScreen();
                    break;
                case 'reveal':
                    renderRevealScreen();
                    break;
                case 'play':
                    renderPlayScreen();
                    break;
                case 'end':
                    renderEndScreen();
                    break;
            }
        }

        // TELA 1: SETUP (Adicionar Jogadores)
        function renderSetupScreen() {
            appElement.classList.add('justify-center');
            
            let html = `
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold tracking-tight text-red-500 mb-1">ESPIÃO</h1>
                    <p class="text-sm text-slate-400">por Daniel Ruas</p>
                </div>
                
                <div class="bg-slate-800 p-5 rounded-2xl shadow-xl mb-6 border border-slate-700">
                    <h2 class="text-lg font-semibold mb-3">Jogadores (${state.players.length})</h2>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="playerName" placeholder="Nome do jogador..." 
                            class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:border-red-500 transition-colors"
                            onkeypress="if(event.key === 'Enter') addPlayer()">
                        <button onclick="addPlayer()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-semibold transition-colors">
                            +
                        </button>
                    </div>
                    
                    <ul id="playersList" class="space-y-2 max-h-48 overflow-y-auto pr-2">
            `;

            if (state.players.length === 0) {
                html += `<li class="text-slate-500 text-sm text-center py-2">Adicione pelo menos 3 jogadores.</li>`;
            } else {
                state.players.forEach((player, index) => {
                    html += `
                        <li class="flex justify-between items-center bg-slate-700 px-3 py-2 rounded-lg">
                            <span>${player}</span>
                            <button onclick="removePlayer(${index})" class="text-red-400 hover:text-red-300 font-bold px-2">&times;</button>
                        </li>
                    `;
                });
            }

            html += `
                    </ul>
                </div>
                
                <button onclick="startGame()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 text-lg">
                    <span>Começar Jogo</span>
                </button>
            `;
            appElement.innerHTML = html;
        }

        // TELA 2: PASSAR CELULAR
        function renderPassScreen() {
            appElement.classList.add('justify-center');
            const currentPlayerName = state.gameData[state.currentPlayerIndex].nome;

            appElement.innerHTML = `
                <div class="text-center bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-700 border-t-4 border-t-blue-500">
                    <div class="text-5xl mb-4">📱</div>
                    <h2 class="text-2xl font-bold mb-2 text-slate-300">Passe o celular para</h2>
                    <h1 class="text-4xl font-bold text-white mb-8">${currentPlayerName}</h1>
                    <p class="text-slate-400 text-sm mb-8">Certifique-se de que ninguém mais está olhando a tela!</p>
                    
                    <button onclick="showReveal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg">
                        Sou Eu! Ver meu papel
                    </button>
                </div>
            `;
        }

        // TELA 3: REVELAR PAPEL
        function renderRevealScreen() {
            appElement.classList.add('justify-center');
            const playerData = state.gameData[state.currentPlayerIndex];
            
            let contentHtml = '';
            
            if (playerData.espião) {
                // É o espião
                contentHtml = `
                    <div class="text-center bg-red-900/40 p-8 rounded-3xl shadow-xl border border-red-800 border-t-4 border-t-red-500">
                        <div class="text-6xl mb-4">🕵️‍♂️</div>
                        <h1 class="text-3xl font-bold text-red-400 mb-2">VOCÊ É O ESPIÃO!</h1>
                        <p class="text-slate-300 mb-6">Mantenha a calma. Tente descobrir onde os outros estão fazendo perguntas, mas não deixe que descubram você!</p>
                    </div>
                `;
            } else {
                // Não é o espião
                contentHtml = `
                    <div class="text-center bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-700 border-t-4 border-t-blue-500">
                        <div class="text-sm text-slate-400 uppercase tracking-widest mb-1">Seu Local</div>
                        <h1 class="text-3xl font-bold text-blue-400 mb-6">${state.currentLocation}</h1>
                        
                        <div class="text-sm text-slate-400 uppercase tracking-widest mb-1">Sua Função</div>
                        <h2 class="text-2xl font-bold text-white mb-6">${playerData.papel}</h2>
                        
                        <p class="text-slate-400 text-sm">Responda às perguntas de acordo com sua função e local, e tente encontrar o Espião!</p>
                    </div>
                `;
            }

            appElement.innerHTML = `
                ${contentHtml}
                <div class="mt-8">
                    <button onclick="nextTurn()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg">
                        Entendido! Esconder.
                    </button>
                </div>
            `;
        }

        // TELA 4: JOGO (Timer e Locais)
        function renderPlayScreen() {
            appElement.classList.remove('justify-center');
            
            const minutes = Math.floor(state.timeRemaining / 60).toString().padStart(2, '0');
            const seconds = (state.timeRemaining % 60).toString().padStart(2, '0');
            const timeColor = state.timeRemaining <= 60 ? 'text-red-500' : 'text-white';

            let locationsHtml = Object.keys(LOCATIONS).sort().map(loc => 
                `<div class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-center text-sm font-medium text-slate-300">${loc}</div>`
            ).join('');

            appElement.innerHTML = `
                <div class="text-center mb-6 pt-4">
                    <h2 class="text-slate-400 text-sm uppercase tracking-wider mb-2">Tempo Restante</h2>
                    <div class="text-6xl font-bold font-mono ${timeColor} drop-shadow-md">
                        ${minutes}:${seconds}
                    </div>
                </div>

                <div class="flex-1 flex flex-col min-h-0">
                    <h3 class="text-lg font-semibold mb-3 text-slate-200">Lista de Locais (Para o Espião):</h3>
                    <div class="grid grid-cols-2 gap-2 overflow-y-auto pb-4 custom-scrollbar">
                        ${locationsHtml}
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-slate-800">
                    <button onclick="revealSpy()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg">
                        Finalizar Jogo / Revelar
                    </button>
                </div>
            `;
        }

        // TELA 5: FIM DE JOGO
        function renderEndScreen() {
            appElement.classList.add('justify-center');
            
            appElement.innerHTML = `
                <div class="text-center bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-700 mb-8 relative overflow-hidden">
                    <div class="absolute inset-0 bg-red-900/20"></div>
                    <div class="relative z-10">
                        <div class="text-6xl mb-4">🚨</div>
                        <h2 class="text-xl text-slate-300 mb-2">O Espião era...</h2>
                        <h1 class="text-4xl font-bold text-red-500 mb-6">${state.spyPlayer}</h1>
                        
                        <div class="w-full h-px bg-slate-700 my-4"></div>
                        
                        <h2 class="text-sm text-slate-400 mb-1">O Local Verdadeiro era:</h2>
                        <h3 class="text-2xl font-bold text-blue-400">${state.currentLocation}</h3>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <button onclick="restartGame(false)" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg">
                        Jogar Novamente (Mesmos Jogadores)
                    </button>
                    <button onclick="restartGame(true)" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95">
                        Novo Jogo (Trocar Jogadores)
                    </button>
                </div>
            `;
        }


        // --- LÓGICA DO JOGO ---

        function addPlayer() {
            const input = document.getElementById('playerName');
            const name = input.value.trim();
            if (name && !state.players.includes(name)) {
                state.players.push(name);
                input.value = '';
                render();
            }
        }

        function removePlayer(index) {
            state.players.splice(index, 1);
            render();
        }

        function startGame() {
            if (state.players.length < 3) {
                alert("O jogo precisa de pelo menos 3 jogadores para ter graça!");
                return;
            }

            // 1. Escolher local aleatório
            const locationNames = Object.keys(LOCATIONS);
            state.currentLocation = locationNames[Math.floor(Math.random() * locationNames.length)];
            
            // 2. Escolher espião
            const spyIndex = Math.floor(Math.random() * state.players.length);
            state.spyPlayer = state.players[spyIndex];

            // 3. Pegar papéis para o local (embaralhar papéis disponíveis)
            let availableRoles = [...LOCATIONS[state.currentLocation]];
            availableRoles = availableRoles.sort(() => Math.random() - 0.5);

            // 4. Distribuir papéis
            state.gameData = state.players.map((playerName, index) => {
                if (index === spyIndex) {
                    return { nome: playerName, espião: true, papel: null };
                } else {
                    // Pega um papel. Se faltar papel (mais jogadores que papéis), repete algum aleatório.
                    const role = availableRoles.pop() || LOCATIONS[state.currentLocation][Math.floor(Math.random() * LOCATIONS[state.currentLocation].length)];
                    return { nome: playerName, espião: false, papel: role };
                }
            });

            // Preparar variáveis da partida
            state.currentPlayerIndex = 0;
            state.timeRemaining = 8 * 60; // 8 minutos
            
            // Mudar para tela de passar
            state.screen = 'pass';
            render();
        }

        function showReveal() {
            state.screen = 'reveal';
            render();
        }

        function nextTurn() {
            state.currentPlayerIndex++;
            if (state.currentPlayerIndex >= state.players.length) {
                // Todos viram, começar o timer!
                state.screen = 'play';
                startTimer();
            } else {
                state.screen = 'pass';
            }
            render();
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timeRemaining--;
                if (state.timeRemaining <= 0) {
                    clearInterval(state.timerInterval);
                    // Pode tocar um som aqui ou apenas parar
                }
                // Só atualiza a tela se estiver na tela de jogo para não bugar
                if (state.screen === 'play') {
                    renderPlayScreen(); // Atualiza apenas o conteúdo, sem a animação geral
                }
            }, 1000);
        }

        function revealSpy() {
            // Parar o timer e ir para tela final
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.screen = 'end';
            render();
        }

        function restartGame(fullReset) {
            if (fullReset) {
                state.players = [];
                state.screen = 'setup';
            } else {
                // Inicia direto com os mesmos jogadores
                startGame();
                return; // startGame já chama render
            }
            render();
        }

        // Iniciar app
        render();
    </script>
</body>
</html>
