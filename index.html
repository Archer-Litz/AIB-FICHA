<body class="min-h-screen p-4 md:p-6 lg:p-8 flex flex-col lg:flex-row gap-6">

    <script>
        // Lógica de Automação dos Graus (Regras originais mantidas)
        const gradeRules = {
            "4": { maestria: "I", gasto: 50, cd: "N/a", limite: "Sem limite" },
            "3": { maestria: "II", gasto: 80, cd: "N/a", limite: "Máx 25" },
            "2": { maestria: "III", gasto: 125, cd: "N/a", limite: "Máx 10" },
            "1": { maestria: "IV", gasto: 250, cd: "2 Turnos", limite: "Máx 5" },
            "Especial": { maestria: "V", gasto: 400, cd: "5 Turnos", limite: "Máx 1" }
        };

        const inputs = document.querySelectorAll('input, select, textarea:not(#output)');
        const output = document.getElementById('output');
        const gradeSelect = document.getElementById('grade');
        
        const infoMaestria = document.getElementById('infoMaestria');
        const infoGasto = document.getElementById('infoGasto');
        const infoCd = document.getElementById('infoCd');
        const infoLimite = document.getElementById('infoLimite');
        const inputS_Maestria = document.getElementById('s_maestria');

        // Lógica de Temas
        const themeGetoBtn = document.getElementById('themeGeto');
        const themeKenjakuBtn = document.getElementById('themeKenjaku');

        function setTheme(theme) {
            if (theme === 'kenjaku') {
                document.body.setAttribute('data-theme', 'kenjaku');
                themeKenjakuBtn.classList.add('active');
                themeGetoBtn.classList.remove('active');
            } else {
                document.body.removeAttribute('data-theme');
                themeGetoBtn.classList.add('active');
                themeKenjakuBtn.classList.remove('active');
            }
        }

        themeGetoBtn.addEventListener('click', () => setTheme('geto'));
        themeKenjakuBtn.addEventListener('click', () => setTheme('kenjaku'));


        function updateAutomatedRules() {
            const rules = gradeRules[gradeSelect.value];
            infoMaestria.innerText = rules.maestria;
            infoGasto.innerText = rules.gasto;
            infoCd.innerText = rules.cd;
            infoLimite.innerText = rules.limite;
            inputS_Maestria.value = rules.maestria; 
            generateOutput();
        }

        function generateOutput() {
            // Obter Valores
            const style = document.getElementById('moldeStyle').value;
            const grade = gradeSelect.value;
            const name = document.getElementById('name').value;
            const desc = document.getElementById('description').value;
            const tech = document.getElementById('technique').value;
            const enStatus = document.getElementById('energyStatus').value;
            const img = document.getElementById('imageUrl').value;
            
            const seigen = document.getElementById('s_seigen').value;
            const rules = gradeRules[grade];

            // Formatação do bloco de Status (Fiel aos nomes originais)
            const createStats = (formatType) => {
                const s = [
                    {k: "Força", v: document.getElementById('s_forca').value},
                    {k: "Velocidade", v: document.getElementById('s_vel').value},
                    {k: "Resistência", v: document.getElementById('s_res').value},
                    {k: "Energia", v: document.getElementById('s_ene').value},
                    {k: "Reflexo", v: document.getElementById('s_ref').value},
                    {k: "Inteligência", v: document.getElementById('s_int').value},
                    {k: "Agilidade", v: document.getElementById('s_agi').value},
                    {k: "Iniciativa", v: document.getElementById('s_ini').value},
                    {k: "Maestria", v: rules.maestria},
                    {k: "Seigen", v: seigen}
                ];

                let out = "";
                for(let i=0; i<s.length; i++) {
                    if(formatType === '1') out += `* ${s[i].k}: ${s[i].v}\n`;
                    if(formatType === '2') out += `> ↳ ||**${s[i].k}:** ${s[i].v}||\n`;
                    if(formatType === '3') out += `> ↳ \`${s[i].k}:\` **${s[i].v}**\n`;
                }
                return out.trim();
            };

            let result = "";

            if (style === "1") {
                // ESTILO 1: O MOLDE ORIGINAL EXATO
                result = `_▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰

> ↳ 【🌗】${tech}
>

>

> ↳ 【🌒】${enStatus}
>

> ↳ 【🌓】${rules.gasto}
> 
**❮❖❯ Cooldown da técnica:**
> ↳ 【🌔】${rules.cd}
> 
**❮❖❯ Imagem (Opcional):**
> ↳ 【🌕】${img}

            } else if (style === "2") {
                // ESTILO 2: SOMBRIO ITÁLICO / SPOILERS (Mantém o texto idêntico, muda os símbolos)
                result = `_▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰
**[👻] Molde de Técnicas de energia amaldiçoada**
▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰_
_**❮❖❯ Nome da técnica / Habilidade:**_
> ↳ _||${name} | Grau ${grade}||_
> 
_**❮❖❯ Descrição da técnica:**_
> ↳ _${desc}_
> 
_**— Status (Por unidade):**_
${createStats('2')}
_**❮❖❯ Técnica (Amaldiçoada / Inata) utilizada:**_
> ↳ _||${tech}||_
> 
_**❮❖❯ Maestria:**_
> ↳ _||${rules.maestria}||_
>

>

            } else if (style === "3") {
                // ESTILO 3: DESTAQUE SISTEMA (Inline code e Negrito)
                result = `▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰

>

> 
**❮❖❯ Gasto da técnica:**
> ↳ \`${rules.gasto}\`
>

> ↳ \`${rules.cd}\`
> 
**❮❖❯ Imagem (Opcional):**
> ↳ ${img}
▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰▰`;
            } 

            output.value = result;
        }

        // Função de Copiar
        document.getElementById('copyBtn').addEventListener('click', () => {
            output.select();
            document.execCommand('copy');
            
            const toast = document.getElementById('toast');
            
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        });

        // Listeners para atualização em tempo real
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                if(input.id === 'grade') updateAutomatedRules();
                else generateOutput();
            });
        });

        // Inicialização
        updateAutomatedRules();

    </script>
</body>
</html>
